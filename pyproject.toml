[project]
name = "tg-bot-skills"
version = "0.1.0"
description = "Personal Telegram ML engineering tutor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.13,<4", "httpx>=0.27,<1", "pydantic>=2.9,<3", "python-dotenv>=1,<2", "tzdata>=2024.1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
